<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    :root {
      --text: #2f3437;
      --muted: #6f7377;
      --border: #e8e2dd;
      --bg: #fffdfb;

      --blue-bg: #eef5fc;
      --blue: #5f7c9c;

      --rose-bg: #faeeee;
      --rose: #b16461;

      --gold-bg: #fbf1e4;
      --gold: #b8833c;

      --lav-bg: #f0eefb;
      --lav: #6f6d9a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      color: var(--text);
      overflow: hidden;
    }

    .project-widget {
      width: 100%;
      height: 104px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--bg);
      padding: 12px 18px 12px 18px;
    }

    .widget-title {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 0 0 12px 0;
      font-size: 13px;
      line-height: 1;
      font-weight: 600;
      color: #344052;
    }

    .title-icon {
      width: 13px;
      height: 13px;
      color: #5f7c9c;
      flex-shrink: 0;
    }

    .stats-row {
      display: grid;
      grid-template-columns: 1fr 1px 1fr 1px 1fr 1px 1fr;
      align-items: center;
      column-gap: 34px;
      height: 58px;
    }

    .stat {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .icon-wrap {
      width: 40px;
      height: 40px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 40px;
    }

    .icon-wrap svg {
      width: 18px;
      height: 18px;
      stroke-width: 2;
    }

    .blue {
      background: var(--blue-bg);
      color: var(--blue);
    }

    .rose {
      background: var(--rose-bg);
      color: var(--rose);
    }

    .gold {
      background: var(--gold-bg);
      color: var(--gold);
    }

    .lavender {
      background: var(--lav-bg);
      color: var(--lav);
    }

    .text-block {
      transform: translateY(-1px);
      min-width: 0;
    }

    .label {
      margin: 0;
      font-size: 10.8px;
      line-height: 1.1;
      font-weight: 600;
      color: #344052;
      white-space: nowrap;
    }

    .number {
      margin: 3px 0 0 0;
      font-size: 20px;
      line-height: 0.9;
      font-weight: 700;
      color: #1f2933;
      letter-spacing: -0.04em;
    }

    .sub {
      margin: 4px 0 0 0;
      font-size: 10px;
      line-height: 1.1;
      font-weight: 400;
      color: var(--muted);
      white-space: nowrap;
    }

    .divider {
      width: 1px;
      height: 44px;
      background: #eee7e2;
    }

    @media (max-width: 800px) {
      body {
        overflow: visible;
      }

      .project-widget {
        height: auto;
      }

      .stats-row {
        grid-template-columns: 1fr 1fr;
        row-gap: 16px;
        column-gap: 20px;
        height: auto;
      }

      .divider {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div class="project-widget">
    <div class="widget-title">
      <svg class="title-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <path d="M12 3.5l1.7 5 5 1.7-5 1.7-1.7 5-1.7-5-5-1.7 5-1.7 1.7-5z"/>
      </svg>
      <span>Project Overview</span>
    </div>

    <div class="stats-row">
      <div class="stat">
        <div class="icon-wrap blue">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M12 3.5l1.7 5 5 1.7-5 1.7-1.7 5-1.7-5-5-1.7 5-1.7 1.7-5z"/>
            <path d="M6 15.5l.8 2.2L9 18.5l-2.2.8L6 21.5l-.8-2.2L3 18.5l2.2-.8L6 15.5z"/>
            <path d="M18 14l.6 1.6 1.6.6-1.6.6L18 18.5l-.6-1.7-1.7-.6 1.7-.6L18 14z"/>
          </svg>
        </div>
        <div class="text-block">
          <p class="label">Active this month</p>
          <p class="number" id="active">0</p>
          <p class="sub">Projects in motion</p>
        </div>
      </div>

      <div class="divider"></div>

      <div class="stat">
        <div class="icon-wrap rose">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M3.5 7.5a2 2 0 0 1 2-2h4l1.6 2h7.4a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2v-9z"/>
            <path d="M3.5 9.5h17"/>
          </svg>
        </div>
        <div class="text-block">
          <p class="label">Waiting on budget</p>
          <p class="number" id="budget">0</p>
          <p class="sub">Need budget approval</p>
        </div>
      </div>

      <div class="divider"></div>

      <div class="stat">
        <div class="icon-wrap gold">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <circle cx="12" cy="12" r="6.8"/>
            <path d="M12 8.2v4.1l2.8 1.6"/>
          </svg>
        </div>
        <div class="text-block">
          <p class="label">Ready soon</p>
          <p class="number" id="ready">0</p>
          <p class="sub">Prep done, go soon</p>
        </div>
      </div>

      <div class="divider"></div>

      <div class="stat">
        <div class="icon-wrap lavender">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M7.5 17.5h8.9a4 4 0 0 0 .4-8A5.1 5.1 0 0 0 7 8.3a4.7 4.7 0 0 0 .5 9.2z"/>
          </svg>
        </div>
        <div class="text-block">
          <p class="label">Dreaming</p>
          <p class="number" id="dreaming">0</p>
          <p class="sub">Ideas for the future</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    async function loadProjectStats() {
      try {
        const response = await fetch("/api/project-overview");
        const data = await response.json();

        document.getElementById("active").textContent = data.active ?? 0;
        document.getElementById("budget").textContent = data.budget ?? 0;
        document.getElementById("ready").textContent = data.ready ?? 0;
        document.getElementById("dreaming").textContent = data.dreaming ?? 0;
      } catch (error) {
        console.error("Could not load project stats", error);
      }
    }

    loadProjectStats();
  </script>
</body>
</html>
