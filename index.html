<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    :root {
      --text: #37352f;
      --muted: #787774;
      --border: #e9e4df;
      --bg: #fffdfb;

      --blue-bg: #eef5fc;
      --blue: #597493;

      --rose-bg: #faeeee;
      --rose: #a75f5e;

      --gold-bg: #fbf2e5;
      --gold: #b8873d;

      --lav-bg: #f1effb;
      --lav: #6d6a95;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      color: var(--text);
      overflow: hidden;
    }

    .project-widget {
      width: 100%;
      height: 94px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--bg);
      padding: 9px 18px 11px 18px;
    }

    .widget-title {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 0 0 9px 0;
      font-size: 13px;
      line-height: 1;
      font-weight: 600;
      color: var(--text);
    }

    .title-icon {
      width: 13px;
      height: 13px;
      color: #53606f;
      flex-shrink: 0;
    }

    .stats-row {
      display: grid;
      grid-template-columns: 1fr 1px 1fr 1px 1fr 1px 1fr;
      align-items: center;
      column-gap: 34px;
      height: 58px;
    }

    .stat {
      display: flex;
      align-items: center;
      gap: 13px;
      min-width: 0;
    }

    .icon-wrap {
      width: 38px;
      height: 38px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 38px;
    }

    .icon-wrap svg {
      width: 15px;
      height: 15px;
      stroke-width: 2.1;
    }

    .blue {
      background: var(--blue-bg);
      color: var(--blue);
    }

    .rose {
      background: var(--rose-bg);
      color: var(--rose);
    }

    .gold {
      background: var(--gold-bg);
      color: var(--gold);
    }

    .lavender {
      background: var(--lav-bg);
      color: var(--lav);
    }

    .text-block {
      transform: translateY(-1px);
      min-width: 0;
    }

    .label {
      margin: 0;
      font-size: 11px;
      line-height: 1.1;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
    }

    .number {
      margin: 3px 0 0 0;
      font-size: 20px;
      line-height: 0.9;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.04em;
    }

    .sub {
      margin: 3px 0 0 0;
      font-size: 10px;
      line-height: 1.1;
      font-weight: 400;
      color: var(--muted);
      white-space: nowrap;
    }

    .divider {
      width: 1px;
      height: 42px;
      background: #eee7e2;
    }

    @media (max-width: 800px) {
      body {
        overflow: visible;
      }

      .project-widget {
        height: auto;
      }

      .stats-row {
        grid-template-columns: 1fr 1fr;
        row-gap: 16px;
        column-gap: 20px;
        height: auto;
      }

      .divider {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div class="project-widget">
    <div class="widget-title">
      <svg class="title-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3z"/>
        <path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8L19 15z"/>
      </svg>
      <span>Project Overview</span>
    </div>

    <div class="stats-row">
      <div class="stat">
        <div class="icon-wrap blue">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3z"/>
            <path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8L19 15z"/>
          </svg>
        </div>
        <div class="text-block">
          <p class="label">Active this month</p>
          <p class="number" id="active">0</p>
          <p class="sub">Projects in motion</p>
        </div>
      </div>

      <div class="divider"></div>

      <div class="stat">
        <div class="icon-wrap rose">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <rect x="5" y="7" width="14" height="12" rx="2"/>
            <path d="M9 7V5.8A1.8 1.8 0 0 1 10.8 4h2.4A1.8 1.8 0 0 1 15 5.8V7"/>
            <path d="M5 12h14"/>
          </svg>
        </div>
        <div class="text-block">
          <p class="label">Waiting on budget</p>
          <p class="number" id="budget">0</p>
          <p class="sub">Need budget approval</p>
        </div>
      </div>

      <div class="divider"></div>

      <div class="stat">
        <div class="icon-wrap gold">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <circle cx="12" cy="12" r="7"/>
            <path d="M12 8v4l3 1.8"/>
          </svg>
        </div>
        <div class="text-block">
          <p class="label">Ready soon</p>
          <p class="number" id="ready">0</p>
          <p class="sub">Prep done, go soon</p>
        </div>
      </div>

      <div class="divider"></div>

      <div class="stat">
        <div class="icon-wrap lavender">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M7.5 18h9.2a4.2 4.2 0 0 0 .4-8.4A5.2 5.2 0 0 0 7.1 8.2A4.9 4.9 0 0 0 7.5 18z"/>
          </svg>
        </div>
        <div class="text-block">
          <p class="label">Dreaming</p>
          <p class="number" id="dreaming">0</p>
          <p class="sub">Ideas for the future</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    async function loadProjectStats() {
      try {
        const response = await fetch("/api/project-overview");
        const data = await response.json();

        document.getElementById("active").textContent = data.active ?? 0;
        document.getElementById("budget").textContent = data.budget ?? 0;
        document.getElementById("ready").textContent = data.ready ?? 0;
        document.getElementById("dreaming").textContent = data.dreaming ?? 0;
      } catch (error) {
        console.error("Could not load project stats", error);
      }
    }

    loadProjectStats();
  </script>
</body>
</html>
