<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      margin: 0;
      padding: 10px;
      background: transparent;
      font-family: Georgia, "Times New Roman", serif;
      color: #4b3b36;
    }

    .project-widget {
      border: 1px solid #e8dfd8;
      border-radius: 12px;
      background: #fffdfb;
      padding: 14px 18px;
      box-sizing: border-box;
      width: 100%;
    }

    .widget-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 14px;
      color: #3f3735;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stats-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr auto 1fr auto 1fr;
      align-items: center;
      gap: 20px;
    }

    .stat {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .icon {
      width: 38px;
      height: 38px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      flex-shrink: 0;
    }

    .blue {
      background: #eef4fb;
      color: #536d89;
    }

    .rose {
      background: #faeeee;
      color: #a95d5d;
    }

    .gold {
      background: #fbf2e5;
      color: #b88336;
    }

    .lavender {
      background: #f1effb;
      color: #6d6a95;
    }

    .label {
      margin: 0;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }

    .number {
      margin: 2px 0 0;
      font-size: 22px;
      line-height: 1;
      font-weight: 700;
    }

    .sub {
      margin: 2px 0 0;
      font-size: 11px;
      color: #8b7d77;
      white-space: nowrap;
    }

    .divider {
      width: 1px;
      height: 44px;
      background: #eee5df;
    }

    @media (max-width: 700px) {
      .stats-row {
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }

      .divider {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div class="project-widget">
    <div class="widget-title">✧ Project Overview</div>

    <div class="stats-row">
      <div class="stat">
        <div class="icon blue">✦</div>
        <div>
          <p class="label">Active this month</p>
          <p class="number" id="active">0</p>
          <p class="sub">Projects in motion</p>
        </div>
      </div>

      <div class="divider"></div>

      <div class="stat">
        <div class="icon rose">▣</div>
        <div>
          <p class="label">Waiting on budget</p>
          <p class="number" id="budget">0</p>
          <p class="sub">Need budget approval</p>
        </div>
      </div>

      <div class="divider"></div>

      <div class="stat">
        <div class="icon gold">◷</div>
        <div>
          <p class="label">Ready soon</p>
          <p class="number" id="ready">0</p>
          <p class="sub">Prep done, go soon</p>
        </div>
      </div>

      <div class="divider"></div>

      <div class="stat">
        <div class="icon lavender">☁</div>
        <div>
          <p class="label">Dreaming</p>
          <p class="number" id="dreaming">0</p>
          <p class="sub">Ideas for the future</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    async function loadProjectStats() {
      const response = await fetch("/api/project-overview");
      const data = await response.json();

      document.getElementById("active").textContent = data.active ?? 0;
      document.getElementById("budget").textContent = data.budget ?? 0;
      document.getElementById("ready").textContent = data.ready ?? 0;
      document.getElementById("dreaming").textContent = data.dreaming ?? 0;
    }

    loadProjectStats();
  </script>
</body>
</html>
