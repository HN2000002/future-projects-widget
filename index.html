<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    :root {
      --text: #37352f;
      --muted: #787774;
      --border: #e9e3df;
      --bg: #fffdfb;
    }

    body {
      margin: 0;
      padding: 0;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Arial, sans-serif;
      color: var(--text);
    }

    .project-widget {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      padding: 10px 18px 12px;
      box-sizing: border-box;
      width: 100%;
      min-height: 94px;
    }

    .widget-title {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 10px;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
      line-height: 1.2;
    }

    .stats-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr auto 1fr auto 1fr;
      align-items: center;
      gap: 26px;
    }

    .stat {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .icon {
      width: 34px;
      height: 34px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }

    .blue {
      background: #edf4fb;
      color: #58708c;
    }

    .rose {
      background: #faeeee;
      color: #a65f5d;
    }

    .gold {
      background: #fbf2e6;
      color: #b98944;
    }

    .lavender {
      background: #f1effb;
      color: #6d6a95;
    }

    .label {
      margin: 0;
      font-size: 11px;
      font-weight: 600;
      line-height: 1.2;
      white-space: nowrap;
    }

    .number {
      margin: 2px 0 0;
      font-size: 20px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .sub {
      margin: 2px 0 0;
      font-size: 10.5px;
      line-height: 1.2;
      color: var(--muted);
      white-space: nowrap;
    }

    .divider {
      width: 1px;
      height: 42px;
      background: #eee7e2;
    }

    @media (max-width: 700px) {
      .project-widget {
        padding: 12px;
      }

      .stats-row {
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }

      .divider {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div class="project-widget">
    <div class="widget-title">✧ Project Overview</div>

    <div class="stats-row">
      <div class="stat">
        <div class="icon blue">✦</div>
        <div>
          <p class="label">Active this month</p>
          <p class="number" id="active">0</p>
          <p class="sub">Projects in motion</p>
        </div>
      </div>

      <div class="divider"></div>

      <div class="stat">
        <div class="icon rose">▣</div>
        <div>
          <p class="label">Waiting on budget</p>
          <p class="number" id="budget">0</p>
          <p class="sub">Need budget approval</p>
        </div>
      </div>

      <div class="divider"></div>

      <div class="stat">
        <div class="icon gold">◷</div>
        <div>
          <p class="label">Ready soon</p>
          <p class="number" id="ready">0</p>
          <p class="sub">Prep done, go soon</p>
        </div>
      </div>

      <div class="divider"></div>

      <div class="stat">
        <div class="icon lavender">☁</div>
        <div>
          <p class="label">Dreaming</p>
          <p class="number" id="dreaming">0</p>
          <p class="sub">Ideas for the future</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    async function loadProjectStats() {
      try {
        const response = await fetch("/api/project-overview");
        const data = await response.json();

        document.getElementById("active").textContent = data.active ?? 0;
        document.getElementById("budget").textContent = data.budget ?? 0;
        document.getElementById("ready").textContent = data.ready ?? 0;
        document.getElementById("dreaming").textContent = data.dreaming ?? 0;
      } catch (error) {
        console.error("Could not load project stats", error);
      }
    }

    loadProjectStats();
  </script>
</body>
</html>
